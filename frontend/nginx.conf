# Nginx config για να σερβίρει το production build (dist/) του React SPA.
# Αντικαθιστά το "vite preview" (βλ. git history) -- η επίσημη τεκμηρίωση
# του Vite λέει ρητά ότι το "vite preview" δεν προορίζεται για production
# ("not designed for it"), και το Blocked-request/allowedHosts πρόβλημα
# που χτυπήσαμε στο Railway το επιβεβαίωσε στην πράξη. Το nginx δεν έχει
# τέτοιο host-allowlist μηχανισμό -- σερβίρει static files σε όποιο domain
# φτάσει το request, καμία allowedHosts ρύθμιση χρειάζεται πια.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip: το "vite preview" δεν το έκανε σωστά (βλ. Vite discussion
    # #16607/#2834) -- το nginx το κάνει ήδη σωστά με λίγες γραμμές config.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: το React Router κάνει client-side routing (/actors,
    # /events/1, κ.λπ.) -- αυτά τα paths ΔΕΝ υπάρχουν ως πραγματικά αρχεία
    # μέσα στο dist/, μόνο το index.html + JS που τα χειρίζεται στον
    # browser. Χωρίς αυτό, ένα direct navigation ή refresh σε /actors θα
    # έδινε 404 από το nginx αντί να φορτώσει το SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
